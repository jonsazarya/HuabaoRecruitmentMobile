name: recruitment_mobile
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  http: ^1.2.0
  shared_preferences: ^2.2.2
  google_fonts: ^6.1.0
  cupertino_icons: ^1.0.8
  curved_navigation_bar: ^1.0.1
  carousel_slider: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.1 
  flutter_pdfview: ^1.3.2 
  path_provider: ^2.1.2

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/logo_huabao_recruitment.png"  
  min_sdk_android: 21
  adaptive_icon_background: "#1D5D9B"    
  adaptive_icon_foreground: "assets/images/logo_huabao_recruitment.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/pdf/